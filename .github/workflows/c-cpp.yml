name: C/C++ CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

# Creating/releases requires write access to repository contents
permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup Git LFS
      run: |
        sudo apt-get update -y
        sudo apt-get install -y git-lfs
        git lfs install
        git lfs fetch --all
        git lfs checkout
    - name: Install ImageMagick
      run: sudo apt-get install -y imagemagick
    - name: Generate PPM textures
      run: ./scripts/textures2ppm.sh
    - name: Build
      run: make
    - name: Run demo and produce an output scene
      run: ./demo output.ppm
    - name: Convert PPM to JPG
      run: |
        if command -v magick >/dev/null 2>&1; then
          magick output.ppm -quality 90 output.jpg
        elif command -v convert >/dev/null 2>&1; then
          convert output.ppm -quality 90 output.jpg
        fi
    - name: Upload rendered image
      uses: actions/upload-artifact@v4
      with:
        name: rendered-image
        path: output.jpg
    
