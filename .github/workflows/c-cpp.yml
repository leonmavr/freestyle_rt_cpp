name: C/C++ CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup git LFS, fetch LFS files
      run: |
        sudo apt-get install -y git-lfs
        git lfs install
        git lfs fetch --all
        git lfs checkout
    - name: Install ImageMagick
      run: sudo apt-get install -y imagemagick
    - name: Generate PPM textures
      run: ./scripts/textures2ppm.sh
    - name: Build with textures and run
      run: make use-textures DEMO=demo00 run
    - name: Convert PPM to JPG
      run: |
        if command -v magick >/dev/null 2>&1; then
          magick output_demo00.ppm -quality 90 output.jpg
        elif command -v convert >/dev/null 2>&1; then
          convert output_demo00.ppm -quality 90 output.jpg
        fi
    - name: Upload rendered image
      uses: actions/upload-artifact@v4
      with:
        name: rendered-image
        path: output.jpg
