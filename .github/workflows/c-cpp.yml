name: C/C++ CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

# Creating/releases requires write access to repository contents
permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: make

    - name: Run demo and produce an output scene
      run: ./demo output.ppm

    - name: Install ImageMagick
      run: |
        sudo apt-get update -y
        sudo apt-get install -y imagemagick

    - name: Convert PPM to JPG
      run: |
        if command -v magick >/dev/null 2>&1; then
          magick output.ppm -quality 90 output.jpg
        elif command -v convert >/dev/null 2>&1; then
          convert output.ppm -quality 90 output.jpg
        fi

    - name: Upload rendered image (JPG only)
      uses: actions/upload-artifact@v4
      with:
        name: rendered-image
        path: output.jpg

    - name: Create a release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: rendered-${{ github.run_number }}
        release_name: rendered-${{ github.run_number }}
        body: "Rendered image from workflow run ${{ github.run_id }}"
        draft: false
        prerelease: false
      if: github.event_name == 'push'

    - name: Upload release image (JPG)
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: output.jpg
        asset_name: output.jpg
        asset_content_type: image/jpeg
      if: github.event_name == 'push'
