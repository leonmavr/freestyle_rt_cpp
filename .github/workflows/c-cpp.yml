name: C/C++ CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: make

    - name: Run demo and produce an output scene
      run: ./demo output.ppm

    - name: Upload rendered image
      uses: actions/upload-artifact@v4
      with:
        name: rendered-image
        path: output.ppm

    - name: Create a release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: rendered-${{ github.run_number }}
        release_name: rendered-${{ github.run_number }}
        body: "Rendered image from workflow run ${{ github.run_id }}"
        draft: false
        prerelease: false

    - name: Upload release image
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: output.ppm
        asset_name: output.ppm
        asset_content_type: application/octet-stream
